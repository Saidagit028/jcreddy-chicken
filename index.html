<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J.C. Reddy’s Farm Fresh Chicken – Amberpet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Tammudu+2:wght@400;600;800&display=swap">
<style>
:root{--red:#b3151b;--green:#0f7a3a;--yel:#f5c400;--bg:#fffaf0;--card:#fff;--ink:#231815;--mut:#6b5f58;--line:#eadfce;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1512;--card:#271f1b;--ink:#f6ece2;--mut:#b9a99b;--line:#3c302a}}
:root[data-theme="dark"]{--bg:#1b1512;--card:#271f1b;--ink:#f6ece2;--mut:#b9a99b;--line:#3c302a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Baloo Tammudu 2','Noto Sans Telugu',system-ui,sans-serif;font-size:16px}
img{max-width:100%;display:block}button{font:inherit;cursor:pointer}
header{background:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:3px solid var(--red)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#fff;z-index:10}
header img{width:100%;max-height:92px;object-fit:contain}
.bar{display:flex;gap:6px;padding:6px 10px;background:var(--green);color:#fff;align-items:center;flex-wrap:wrap}
.bar b{flex:1;min-width:140px;font-weight:600}
.pill{border:0;border-radius:99px;padding:5px 14px;background:var(--yel);color:#231815;font-weight:800;text-decoration:none}
main{max-width:1000px;margin:0 auto;padding:12px}
.rate{background:var(--yel);color:#231815;border-radius:12px;padding:10px 14px;font-weight:800;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px}
.free{margin:10px 0;border:2px dashed var(--green);color:var(--green);border-radius:12px;padding:8px 12px;font-weight:800;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card img{aspect-ratio:4/3;object-fit:cover;width:100%}
.cb{padding:10px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.cb h3{margin:0;font-size:19px;line-height:1.2}.cb h3 small{display:block;color:var(--mut);font-weight:400;font-size:14px}
.price{color:var(--red);font-weight:800;font-size:22px}.price small{color:var(--mut);font-size:13px;font-weight:400}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:40px;height:40px;border-radius:10px;border:2px solid var(--green);background:transparent;color:var(--green);font-size:22px;font-weight:800}
.qty input{width:70px;height:40px;text-align:center;border:2px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:3px 12px}
.add{margin-top:auto;border:0;border-radius:12px;padding:11px;background:var(--red);color:#fff;font-weight:800;font-size:17px}
.add:disabled{background:var(--line);color:var(--mut);cursor:not-allowed}
.oos{position:absolute;margin:8px;background:#000c;color:#fff;border-radius:8px;padding:2px 10px}
.fab{position:fixed;right:12px;z-index:6;border:0;border-radius:99px;padding:12px 18px;font-weight:800;color:#fff;box-shadow:0 3px 10px #0004;text-decoration:none}
#cartBtn{bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--red)}
#waBtn{bottom:calc(70px + env(safe-area-inset-bottom,0px));background:#1faa52}
.drawer{position:fixed;inset:0;background:#0007;z-index:20;display:none}.drawer.on{display:block}
.sheet{position:absolute;right:0;top:0;bottom:0;width:min(460px,100%);background:var(--bg);padding:14px;overflow:auto}
.row{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.row img{width:54px;height:54px;border-radius:8px;object-fit:cover}.row div{flex:1;line-height:1.2}
.sheet input,.sheet textarea,.sheet select{width:100%;padding:10px;margin:4px 0;border:2px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--ink)}
.big{width:100%;border:0;border-radius:12px;padding:13px;font-weight:800;font-size:18px;color:#fff;background:#1faa52;margin-top:8px}
.alt{background:var(--green)}.x{float:right;border:0;background:none;font-size:28px;color:var(--ink)}
.adm{background:var(--card);border:2px solid var(--red);border-radius:12px;padding:12px;margin:10px 0}
.adm label{display:flex;gap:8px;align-items:center;margin:4px 0}.adm input[type=number]{width:90px;padding:6px;border:1px solid var(--line);border-radius:8px;font:inherit}
footer{text-align:center;color:var(--mut);padding:20px 12px 110px}footer a{color:var(--red)}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
</style></head><body>

<div id="lt_${i.id}" style="font-weight:800">${v&&i.rate?fmt(v*i.rate):''}</div>
<button class="add" data-a="${i.id}" ${ok&&v>0?'':'disabled'}>${t('add')}</button></div></div>`}).join('')}
function setQ(id,v){v=Math.max(0,Math.round(v*4)/4);q[id]=v;const i=D.items.find(x=>x.id===id);$('q_'+id).value=v||'';$('lt_'+id).textContent=v&&i.rate?fmt(v*i.rate):'';document.querySelector(`[data-a="${id}"]`).disabled=!(v>0&&i.rate>0&&!i.out)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.d)setQ(b.dataset.d,(q[b.dataset.d]||0)+parseFloat(b.dataset.s));
 else if(b.dataset.c)setQ(b.dataset.c,parseFloat(b.dataset.v));
 else if(b.dataset.a){const i=D.items.find(x=>x.id===b.dataset.a),v=q[i.id],ex=cart.find(c=>c.id===i.id);if(ex){ex.qty+=v;ex.rate=i.rate}else cart.push({id:i.id,qty:v,rate:i.rate});setQ(i.id,0);save();topbar();const o=b.textContent;b.textContent=t('added');setTimeout(()=>b.textContent=t('add'),900)}});
document.addEventListener('input',e=>{if(e.target.dataset.i)setQ(e.target.dataset.i,parseFloat(e.target.value)||0)});
$('lang').onclick=()=>{L=L==='en'?'te':'en';save();topbar();grid();if($('dr').classList.contains('on'))sheet()};
$('cartBtn').onclick=()=>{$('dr').classList.add('on');sheet()};
$('dr').onclick=e=>{if(e.target.id==='dr')$('dr').classList.remove('on')};
const getH=()=>{try{return JSON.parse(localStorage.getItem('jc_orders')||'[]')}catch(e){return[]}};
function hist(){const h=getH();if(!h.length)return'';return `<h3>${L==='te'?'గత ఆర్డర్లు':'Previous orders'}</h3>`+h.map((o,k)=>`<div class="row"><div><b>${o.when}</b><br>${o.items.map(c=>{const i=D.items.find(x=>x.id===c.id);return i?nm(i)+' '+c.qty+' '+t('kg'):''}).join(', ')}</div><button class="pill" data-re="${k}">${L==='te'?'మళ్ళీ ఆర్డర్':'Reorder'}</button></div>`).join('')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-re]');if(!b)return;const o=getH()[b.dataset.re];if(!o)return;o.items.forEach(c=>{const i=D.items.find(x=>x.id===c.id);if(!i||i.out||!(i.rate>0))return;const ex=cart.find(z=>z.id===c.id);if(ex){ex.qty+=c.qty;ex.rate=i.rate}else cart.push({id:c.id,qty:c.qty,rate:i.rate})});save();topbar();sheet()});
function logOrder(n,p,a,total){const items=cart.map(c=>({id:c.id,qty:c.qty,rate:c.rate})),when=new Date().toLocaleString('en-IN');try{const h=getH();h.unshift({when,items,total});localStorage.setItem('jc_orders',JSON.stringify(h.slice(0,10)))}catch(e){}
(async()=>{try{const db=await claude.use('db');if(!db)return;await db.collection('orders').add({ts:Date.now(),when,name:n,phone:p,address:a,items:items.map(c=>{const i=D.items.find(x=>x.id===c.id);return i.en+' '+c.qty+'kg @'+c.rate}).join('; '),total})}catch(e){}})()}
const tot=()=>cart.reduce((s,c)=>s+c.qty*c.rate,0);
function sheet(){const s=$('sheet');if(!cart.length){s.innerHTML=`<button class="x" onclick="$('dr').classList.remove('on')">×</button><h2>${t('cart')}</h2><p>${t('empty')}</p>`+hist();return}
 s.innerHTML=`<button class="x" onclick="$('dr').classList.remove('on')" aria-label="close">×</button><h2>${t('cart')}</h2><div class="free">${t('free')}</div>`+cart.map((c,k)=>{const i=D.items.find(x=>x.id===c.id);return `<div class="row"><img src="${IMG[c.id]}" alt=""><div><b>${nm(i)}</b><br>${fmt(c.rate)} ${t('per')} · <b>${fmt(c.qty*c.rate)}</b></div><div class="qty" style="flex:none"><button data-k="${k}" data-s="-.25">−</button><span>${c.qty}</span><button data-k="${k}" data-s=".25">+</button></div></div>`}).join('')+
 `<h3>${t('total')}: ${fmt(tot())}</h3><input id="cn" placeholder="${t('name')}" autocomplete="name"><input id="cp" placeholder="${t('ph')}" inputmode="tel" autocomplete="tel"><textarea id="ca" rows="2" placeholder="${t('adr')}"></textarea><input id="cl" placeholder="${t('lm')}"><select id="ct"><option>${t('asap')}</option><option>Morning 8–11</option><option>Afternoon 12–3</option><option>Evening 5–8</option></select><textarea id="cx" rows="2" placeholder="${t('note')}"></textarea><button class="big alt" id="gl">${loc?t('locok'):'📍 '+t('loc')}</button><button class="big" id="po">${t('place')}</button>`+hist();
 s.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const c=cart[b.dataset.k];c.qty=Math.round((c.qty+parseFloat(b.dataset.s))*4)/4;if(c.qty<=0)cart.splice(b.dataset.k,1);save();topbar();sheet()});
 $('gl').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{loc='https://maps.google.com/?q='+p.coords.latitude+','+p.coords.longitude;$('gl').textContent=t('locok')},()=>alert(t('adr')),{enableHighAccuracy:true}):alert(t('adr'));
 $('po').onclick=()=>{const n=$('cn').value.trim(),p=$('cp').value.trim(),a=$('ca').value.trim();if(!n||!p||!a){alert(t('need'));return}
  const lines=cart.map(c=>{const i=D.items.find(x=>x.id===c.id);return `• ${i.en}: ${c.qty} kg x ${c.rate} = ₹${c.qty*c.rate}`}).join('\n');
  const m=`🐔 NEW ORDER - J.C. Reddy’s Chicken\nName: ${n}\nPhone: ${p}\nAddress: ${a}\nLandmark: ${$('cl').value}\n\n${lines}\n\nTotal: ₹${tot()} (FREE Delivery)\nDelivery: ${$('ct').value}\nNotes: ${$('cx').value||'-'}\n📍 Location: ${loc||'not shared'}\nDate: ${new Date().toLocaleString('en-IN')}`;
  window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(m),'_blank');logOrder(n,p,a,tot());cart=[];save();topbar();s.innerHTML=`<button class="x" onclick="$('dr').classList.remove('on')">×</button><h2>✓</h2><p>${t('thanks')}</p>`}}
const SHEET_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vQiAlbEAXAYQbSBrGLcmGbCY6Ndet6SH61AvgU_fvqWXNj77KJ6UTPgmiUh7d9E-s4m3Xaxbq4Tjqdg/pub?output=csv';
async function loadRates(){try{
 if(SHEET_URL.startsWith('PASTE'))throw 0;
 const r=await fetch(SHEET_URL+(SHEET_URL.includes('?')?'&':'?')+'t='+Date.now());if(!r.ok)throw 0;
 const rows=(await r.text()).trim().split(/\r?\n/).slice(1).map(l=>l.split(','));
 rows.forEach(c=>{const i=D.items.find(x=>x.id===(c[0]||'').trim());if(i){i.rate=parseFloat(c[2])||0;i.out=/^(y|yes|out|true)/i.test((c[3]||'').trim())}});
 try{localStorage.setItem('jc_rates',JSON.stringify(D.items.map(i=>[i.id,i.rate,i.out])))}catch(e){}
}catch(e){try{(JSON.parse(localStorage.getItem('jc_rates')||'[]')).forEach(([id,r,o])=>{const i=D.items.find(x=>x.id===id);if(i){i.rate=r;i.out=o}})}catch(x){}}
 D.date=new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});topbar();grid()}
topbar();grid();loadRates();setInterval(loadRates,300000);
</script></body></html>
